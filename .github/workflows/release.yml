# Builds installers when a version tag is pushed (v0.1.0, …) and publishes them
# to GitHub Releases, where the app's automatic updates find them.
#
# A tag with a pre-release part (v0.2.0-beta.1) becomes a GitHub pre-release,
# never "Latest". Installed copies on a normal version only look at "Latest",
# so a beta never reaches them; only someone who installs the beta by hand gets it.
#
# Signing is used only when its secrets are set, so forks still build
# (unsigned) installers:
#
# Windows (Azure Artifact Signing, same setup as the ringkeeper repo):
#   secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#             WIN_PUBLISHER_NAME (exactly as on the certificate)
#   or a .pfx certificate: secrets WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
# macOS (Developer ID + notarization):
#   secrets   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Unsigned macOS builds can't update themselves (macOS requires a signature);
# users of those builds download new versions by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-runtimes.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - name: The tag matches the app's version
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match apps/desktop/package.json version $v"; exit 1; }

  # Create the release once, as a draft, before the builds start. Each build
  # uploads into it; it's published only after every build succeeded. (Letting
  # each build create the release made two parallel uploads each create one:
  # v0.1.0 ended up split across two releases.)
  draft:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the draft release with install notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          pre=""
          : > "$RUNNER_TEMP/notes.md"
          case "$version" in
            *-*)
              pre="--prerelease"
              echo "> **Test version.** Copies of the normal version don't update to this one. Install it by hand to try it." >> "$RUNNER_TEMP/notes.md"
              echo "" >> "$RUNNER_TEMP/notes.md"
              ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; builds will upload to it."
          else
            # This version's section of CHANGELOG.md ("## <version>"), when it has one.
            news="$(awk -v head="## $version" '$0 == head { on = 1; next } /^## / { if (on) exit } on' CHANGELOG.md 2>/dev/null || true)"
            if [ -n "$(printf '%s' "$news" | tr -d '[:space:]')" ]; then
              { echo "## What's new"; printf '%s\n\n' "$news"; } >> "$RUNNER_TEMP/notes.md"
            fi
            sed "s/{{VERSION}}/$version/g" .github/release-notes.md >> "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  windows:
    needs: draft
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Ringkeeper Connect's registered Google and Microsoft apps (docs/registered-apps.md).
      RINGKEEPER_GOOGLE_CLIENT_ID: ${{ vars.RINGKEEPER_GOOGLE_CLIENT_ID }}
      RINGKEEPER_GOOGLE_CLIENT_SECRET: ${{ secrets.RINGKEEPER_GOOGLE_CLIENT_SECRET }}
      RINGKEEPER_MICROSOFT_CLIENT_ID: ${{ vars.RINGKEEPER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-runtimes.mjs win32-x64
      - name: Say whether this build is signed
        shell: bash
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then echo "Signing with Azure Artifact Signing";
          elif [ -n "$WIN_CSC_LINK" ]; then echo "Signing with the .pfx certificate";
          else echo "::warning::No Windows signing secrets: the installer will be unsigned (SmartScreen will warn)."; fi
      - name: Build and publish
        run: pnpm package:desktop --win --x64 --publish always

  macos:
    needs: draft
    # One job builds both architectures, so the update feed (latest-mac.yml)
    # lists both and each Mac downloads its own.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RINGKEEPER_GOOGLE_CLIENT_ID: ${{ vars.RINGKEEPER_GOOGLE_CLIENT_ID }}
      RINGKEEPER_GOOGLE_CLIENT_SECRET: ${{ secrets.RINGKEEPER_GOOGLE_CLIENT_SECRET }}
      RINGKEEPER_MICROSOFT_CLIENT_ID: ${{ vars.RINGKEEPER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-runtimes.mjs darwin-arm64
      - run: node scripts/fetch-runtimes.mjs darwin-x64
      - name: Say whether this build is signed
        run: |
          if [ -n "$CSC_LINK" ]; then echo "Signing with the Developer ID certificate${APPLE_ID:+ and notarizing}";
          else echo "::warning::No macOS signing secrets: the app will be unsigned and can't update itself."; echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; fi
      - name: Build and publish
        run: pnpm package:desktop --mac --arm64 --x64 --publish always

  # Everything built and uploaded: make the release public. A normal version
  # becomes "Latest" (what installed copies update to); a pre-release never does.
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the release
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
